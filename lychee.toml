# Link checking for this repository's Markdown.
#
# Internal links are checked strictly. External links are checked except where
# the answer would be meaningless, and each exclusion below says why.

exclude_path = [
  "node_modules",
  ".next",
  ".medusa",
]

exclude = [
  # Five repositories in this universe are private. An anonymous checker gets
  # 404 for a private repository that exists, which is a false failure rather
  # than a finding. Narrowed to exactly those five: every other
  # `hannosirkel/*` link, including every standards link the generated
  # `AGENTS.md` baseline carries, is checked for real.
  "^https://github\\.com/hannosirkel/(architecture|orange|orange-inventory|myskills|entpass)(/|$)",

  # The README documents the local development stack's addresses. A link
  # checker running in CI has no storefront, no backend and no mail sink
  # listening, so these can only ever fail. Baselined, not fixed: the
  # addresses are correct and are what a developer needs to read.
  "^https?://(localhost|127\\.0\\.0\\.1)(:[0-9]+)?(/|$)",
]

# GitHub rate-limits anonymous requests hard enough to make a run flaky.
max_concurrency = 4
max_retries = 2
timeout = 20

accept = ["200", "204", "206", "429"]
